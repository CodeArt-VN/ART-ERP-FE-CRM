<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>
<ion-content [fullscreen]="true" appScrollbarTheme>
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<ion-fab *ngIf="pageConfig.isShowFeature && pageConfig.canMerge " class="feature" vertical="top" horizontal="end"
		slot="fixed">
		<div>
			<ion-list-header lines="full">
				<ion-label>{{'Find duplicates' | translate}}</ion-label>
			</ion-list-header>

			<ion-radio-group (ionChange)="changeDuplicateKeywork($event)" [value]="'WorkPhone'">
				<ion-item>
					<ion-radio slot="start" aria-label="Danger" [value]="'WorkPhone'" color="primary" class="radio-icon"
						mode="md"></ion-radio>
					<ion-label style="white-space: normal">{{'WorkPhone' | translate}}</ion-label>
				</ion-item>
				<ion-item>
					<ion-radio slot="start" aria-label="Danger" [value]="'TaxCode'" color="primary" class="radio-icon"
						mode="md"></ion-radio>
					<ion-label style="white-space: normal">{{'TaxCode' | translate}}</ion-label>
				</ion-item>
			</ion-radio-group>
			<div class="ion-padding">
				<ion-button (click)="findByDuplicate()" expand="block">{{'Find...'| translate}}</ion-button>
			</div>

			<ion-list-header lines="full" *ngIf="mergeFunction.items.length">
				<ion-label>{{'Duplicate contacts' | translate}}</ion-label>
			</ion-list-header>

			<app-page-message [itemsLength]="mergeFunction.items.length"
				[showSpinner]="mergeFunction.showSpinner"></app-page-message>

			<ion-list *ngIf="mergeFunction.items.length && mergeFunction.showSpinner==false">
				<app-virtual-viewport
					#dupVp="virtualViewport"
					mode="page"
					class="page-mode"
					[items]="mergeFunction.items"
					idKey="Value"
					[defaultItemSize]="48"
				>
					<ion-item
						lines="full"
						*ngFor="let i of dupVp.renderedItems; trackBy: trackByDuplicateValue"
						[virtualItemMeasure]="i.Value"
						[measureGeneration]="dupVp.measureGeneration"
						(heightMeasured)="dupVp.onItemMeasured(i.Value, $event)"
					>
						<ion-icon size="small" slot="start" name="search"></ion-icon>
						<ion-label *ngIf="findByValue=='TaxCode'" clickable
							(click)="query.TaxCode_eq=i.Value;refresh()">{{i.Value}}</ion-label>
						<ion-label *ngIf="findByValue=='WorkPhone'" clickable
							(click)="query.WorkPhone_eq=i.Value;refresh()">{{i.Value}}</ion-label>
						<ion-note color="primary">{{i.Count}}</ion-note>
					</ion-item>
				</app-virtual-viewport>
			</ion-list>
		</div>
	</ion-fab>


	<div class="safe-max-width">
		<app-data-table class="box-shadow responsive padding-number-right" [rows]="items" [trackBy]="'Id'" [(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner" [showFilter]="pageConfig.isShowSearch" [(query)]="query"
			(dataInfinite)="loadData($event)" (filter)="onDatatableFilter($event)" (sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)">
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-icon large flag-filter" name="" property="Id">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						[color]="query.IsPersonal===true ? 'success' : (query.IsPersonal===false ? 'warning' : 'primary')"
						(click)="query.IsPersonal=query.IsPersonal===true?false:(query.IsPersonal===false? '': true); refresh()"
						[name]="query.IsPersonal===true?'person-outline':(query.IsPersonal===false?'business-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" [color]="i.IsPersonal?'success':'warning'"
						[name]="i.IsPersonal?'person-outline':'business-outline'"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" name="Name" property="Name">
				<ng-template let-i="row" datatable-cell-template>
					<div [routerLink]="['/'+pageConfig.pageName+'/'+i.Id]">
						<a class="bold">
							<ion-text color="dark">{{i.Name}}</ion-text>
						</a>
						<div *ngIf="i.Remark">{{i.Remark}}</div>
					</div>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-code" name="Telephone" property="WorkPhone">
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of outlet" property="IsOutlets">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsOutlets=query.IsOutlets===true?false:(query.IsOutlets===false? '': true); refresh()"
						[name]="query.IsOutlets===true?'checkmark-outline':(query.IsOutlets===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsOutlets" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of storer" property="IsStorer">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsStorer=query.IsStorer===true?false:(query.IsStorer===false? '': true); refresh()"
						[name]="query.IsStorer===true?'checkmark-outline':(query.IsStorer===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsStorer" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of vendor" property="IsVendor">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsVendor=query.IsVendor===true?false:(query.IsVendor===false? '': true); refresh()"
						[name]="query.IsVendor===true?'checkmark-outline':(query.IsVendor===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsVendor" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of carrier" property="IsCarrier">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsCarrier=query.IsCarrier===true?false:(query.IsCarrier===false? '': true); refresh()"
						[name]="query.IsCarrier===true?'checkmark-outline':(query.IsCarrier===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsCarrier" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of branch" property="IsBranch">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsBranch=query.IsBranch===true?false:(query.IsBranch===false? '': true); refresh()"
						[name]="query.IsBranch===true?'checkmark-outline':(query.IsBranch===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsBranch" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-id flag-filter" name="abbreviation of staff" property="IsStaff">
				<ng-template datatable-filter-template>
					<ion-icon
						class="min-btn clickable"
						(click)="query.IsStaff=query.IsStaff===true?false:(query.IsStaff===false? '': true); refresh()"
						[name]="query.IsStaff===true?'checkmark-outline':(query.IsStaff===false?'ban-outline':'checkmark-done-outline')"
					></ion-icon>
				</ng-template>
				<ng-template let-i="row" datatable-cell-template>
					<ion-icon class="min-btn" *ngIf="i.IsStaff" name="checkmark"></ion-icon>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-status" name="Status" property="Status" filterControlType="ng-select"
				[filterDataSource]="statusList">
				<ng-template let-i="row" datatable-cell-template>
					<ion-badge [color]="i.StatusColor" [title]="i.StatusText"> {{i.StatusText | translate}} </ion-badge>
				</ng-template>
			</datatable-column>

		</app-data-table>
	</div>
</ion-content>
