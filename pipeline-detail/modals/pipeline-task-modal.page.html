<ion-header [translucent]="true" collapse="fade">
	<ion-toolbar>
		<ion-title>{{ item?.Id ? item.Name : ('New task' | translate) }}</ion-title>
		<ion-buttons slot="primary">
			<ion-button title="{{ 'Close' | translate }}" color="secondary" (click)="closeModal()">
				<ion-icon slot="icon-only" name="close"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" appScrollbarTheme>
	<div id="pipeline-task-modal" style="position: absolute; z-index: 30005"></div>
	<form [formGroup]="formGroup">
		<ion-grid fixed>
			<ion-row>
				<ion-col size="12">
					<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }"></app-form-control>
					<app-form-control
						[field]="{ id: 'IDStage', label: 'Stage', type: 'ng-select', dataSource: stageOptions, bindValue: 'Id', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-task-modal' }"
					></app-form-control>
					<app-form-control
						[field]="{ id: 'TaskType', label: 'Task type', type: 'ng-select', dataSource: taskTypes, bindValue: 'Code', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-task-modal' }"
						(change)="onTypeChange()"
					></app-form-control>
					<app-form-control
						*ngIf="isDocument"
						[field]="{ id: 'DocumentType', label: 'Document type', type: 'ng-select', dataSource: documentTypes, bindValue: 'Code', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-task-modal' }"
					></app-form-control>
				</ion-col>
				<ion-col size="12">
					<app-form-control [field]="{ id: 'DueOffsetDays', label: 'Due (days)', type: 'number', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'IsRequired', label: 'Required', type: 'checkbox', form: formGroup }"></app-form-control>
				</ion-col>
			</ion-row>
		</ion-grid>
	</form>
</ion-content>
<ion-footer [translucent]="true" collapse="fade">
	<ion-toolbar>
		<div slot="start">
			<ion-button fill="outline" *ngIf="item?.Id" (click)="delete()" color="danger">{{ 'Delete' | translate }}</ion-button>
		</div>
		<div slot="end">
			<ion-button fill="outline" color="warning" (click)="closeModal()">{{ 'Cancel' | translate }}</ion-button>
			<ion-button [strong]="true" (click)="saveChange()" [disabled]="!formGroup.dirty">{{ 'Save' | translate }}</ion-button>
		</div>
	</ion-toolbar>
</ion-footer>
