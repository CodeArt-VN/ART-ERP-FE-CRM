<ion-header [translucent]="true" collapse="fade">
	<ion-toolbar>
		<ion-title>{{ item?.Id ? item.Name : ('New rule' | translate) }}</ion-title>
		<ion-buttons slot="primary">
			<ion-button title="{{ 'Close' | translate }}" color="secondary" (click)="closeModal()">
				<ion-icon slot="icon-only" name="close"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" appScrollbarTheme>
	<div id="pipeline-rule-modal" style="position: absolute; z-index: 30005"></div>
	<form [formGroup]="formGroup">
		<ion-grid fixed>
			<ion-row>
				<ion-col size="12">
					<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }"></app-form-control>
					<app-form-control
						[field]="{ id: 'IDServiceType', label: 'Service type', type: 'ng-select', dataSource: serviceTypes, bindValue: 'Id', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-rule-modal' }"
					></app-form-control>
					<app-form-control
						[field]="{ id: 'CustomerType', label: 'Customer type', type: 'ng-select', dataSource: customerTypes, bindValue: 'Code', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-rule-modal' }"
					></app-form-control>
					<app-form-control
						[field]="{ id: 'CustomerHistory', label: 'History', type: 'ng-select', dataSource: customerHistories, bindValue: 'Code', bindLabel: 'Name', form: formGroup, appendTo: '#pipeline-rule-modal' }"
					></app-form-control>
					<app-form-control [field]="{ id: 'MinGuests', label: 'Min guests', type: 'number', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'MaxGuests', label: 'Max guests', type: 'number', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'Priority', label: 'Priority', type: 'number', form: formGroup }"></app-form-control>
				</ion-col>
			</ion-row>
		</ion-grid>
	</form>
</ion-content>
<ion-footer [translucent]="true" collapse="fade">
	<ion-toolbar>
		<div slot="start">
			<ion-button fill="outline" *ngIf="item?.Id" (click)="delete()" color="danger">{{ 'Delete' | translate }}</ion-button>
		</div>
		<div slot="end">
			<ion-button fill="outline" color="warning" (click)="closeModal()">{{ 'Cancel' | translate }}</ion-button>
			<ion-button [strong]="true" (click)="saveChange()" [disabled]="!formGroup.dirty">{{ 'Save' | translate }}</ion-button>
		</div>
	</ion-toolbar>
</ion-footer>
