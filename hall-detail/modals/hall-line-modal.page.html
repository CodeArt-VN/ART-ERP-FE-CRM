<ion-header [translucent]="true" collapse="fade">
	<ion-toolbar>
		<ion-title>{{ item?.Id ? item.Name : ('New line' | translate) }}</ion-title>
		<ion-buttons slot="primary">
			<ion-button title="{{ 'Close' | translate }}" color="secondary" (click)="closeModal()">
				<ion-icon slot="icon-only" name="close"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" appScrollbarTheme>
	<form [formGroup]="formGroup">
		<ion-grid fixed>
			<ion-row>
				<ion-col size="12">
					<app-form-control [field]="{ id: 'LineNo', label: 'Line #', type: 'number', mask: 'separator.0', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'Code', label: 'Code', type: 'text', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'AreaSqm', label: 'Area (m²)', type: 'number', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'SizeText', label: 'Size', type: 'text', form: formGroup }"></app-form-control>
					<app-form-control [field]="{ id: 'MaxGuests', label: 'Max guests', type: 'number', mask: 'separator.0', form: formGroup }"></app-form-control>
					<app-form-control
						*ngFor="let c of capacityFields"
						[field]="{ id: c.id, label: c.label, type: 'number', mask: 'separator.0', form: formGroup }"
					></app-form-control>
					<app-form-control [field]="{ id: 'Remark', label: 'Remark', type: 'textarea', form: formGroup }"></app-form-control>
					<app-form-control *ngIf="item?.Id" [field]="{ id: 'IsDisabled', label: 'Disabled', type: 'checkbox', form: formGroup }"></app-form-control>
				</ion-col>
			</ion-row>
		</ion-grid>
	</form>
</ion-content>
<ion-footer [translucent]="true" collapse="fade">
	<ion-toolbar>
		<div slot="start">
			<ion-button fill="outline" *ngIf="item?.Id && pageConfig.canDelete" (click)="delete()" color="danger">{{ 'Delete' | translate }}</ion-button>
		</div>
		<div slot="end">
			<ion-button fill="outline" color="warning" (click)="closeModal()">{{ 'Cancel' | translate }}</ion-button>
			<ion-button [strong]="true" (click)="saveChange()" [disabled]="!formGroup.dirty">{{ 'Save' | translate }}</ion-button>
		</div>
	</ion-toolbar>
</ion-footer>
