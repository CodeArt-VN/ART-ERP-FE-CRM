<ion-header [translucent]="true" collapse="fade">
	<ion-toolbar>
		<ion-title>{{ item?.Id ? (item.Name || item.Code || ('Contract' | translate)) : ('New contract' | translate) }}</ion-title>
		<ion-buttons slot="primary">
			<ion-button title="{{ 'Close' | translate }}" color="secondary" (click)="closeModal()">
				<ion-icon slot="icon-only" name="close"></ion-icon>
			</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme>
	<div id="crm-contract-modal" style="position: absolute; z-index: 30005"></div>
	<form [formGroup]="formGroup">
		<div class="edit-box">
			<ion-grid fixed>
				<ion-row>
					<ion-col size="12">
						<app-form-control [field]="{ id: 'Code', label: 'Code', type: 'text', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }"></app-form-control>
						<app-form-control
							*ngIf="quotations?.length"
							[field]="{ id: 'IDQuotation', label: 'Quotation', type: 'ng-select', dataSource: quotations, bindValue: 'Id', bindLabel: 'Name', form: formGroup, appendTo: '#crm-contract-modal' }"
						></app-form-control>
						<app-form-control [field]="{ id: 'ContractDate', label: 'Contract date', type: 'date', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'EventDate', label: 'Event date', type: 'date', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'EndDate', label: 'End date', type: 'date', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'NumberOfGuests', label: 'Guests', type: 'number', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'Amount', label: 'Amount', type: 'number', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'Remark', label: 'Remark', type: 'textarea', form: formGroup }"></app-form-control>
					</ion-col>
				</ion-row>
			</ion-grid>
		</div>
	</form>
</ion-content>

<ion-footer [translucent]="true" collapse="fade">
	<ion-toolbar>
		<div slot="start">
			<ion-button fill="outline" *ngIf="item?.Id && canDelete" (click)="delete()" color="danger">{{ 'Delete' | translate }}</ion-button>
		</div>
		<div slot="end">
			<ion-button fill="outline" color="warning" (click)="closeModal()">{{ 'Cancel' | translate }}</ion-button>
			<ion-button *ngIf="canEdit" [strong]="true" (click)="saveChange()" [disabled]="busy || formGroup.invalid || (item?.Id && !formGroup.dirty)">
				{{ 'Save' | translate }}
			</ion-button>
		</div>
	</ion-toolbar>
</ion-footer>
