<ion-header [translucent]="true">
	<app-toolbar [page]="this">
		<ng-container tollbarSelected>
			<ion-button class="clickable" title="{{'Evaluate Levels' | translate}}" (click)="LevelEvaluation()">
				<ion-icon name="calculator-outline" color="success" slot="icon-only"></ion-icon>
			</ion-button>
		</ng-container>
	</app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" [ngClass]="{withFeature: pageConfig.isShowFeature}" forceOverscroll="false">
	<ion-refresher [disabled]="!pageConfig.refresher" slot="fixed" (ionRefresh)="refresh($event)">
		<ion-refresher-content></ion-refresher-content>
	</ion-refresher>
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>
	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#" property="Id" [navLink]="pageConfig.pageName"></datatable-column>
			<datatable-column class="col-name" name="Name" property="Name">
				<ng-template let-i="row" datatable-cell-template>
					<div [routerLink]="['/'+pageConfig.pageName+'/'+i.Id]">
						<a class="bold">
							<ion-text color="dark">{{i.Name}}</ion-text>
							<small *ngIf="i.IsTriggerable">{{'Triggerable'}}</small>
						</a>
						<div *ngIf="i.Remark">{{i.Remark}}</div>
					</div>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" name="Contact" property="_Contact.Name">
				<ng-template let-i="row" datatable-cell-template>
					<span *ngIf="i._Contact.Name" class="bold">{{i._Contact.Name}}</span>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" name="Policy Level" property="_PolLevel.ID" filterControlType="ng-select"
				[filterDataSource]="polLevelList" filterBindValue="Id" filterBindLabel="Name">
				<ng-template let-i="row" datatable-cell-template>
					<span *ngIf="i._PolLevel.Name" class="bold">{{i._PolLevel.Name}}</span>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" format="1.0-0" name="Point" property="Point"></datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
